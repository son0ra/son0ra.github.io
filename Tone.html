<meta name="apple-mobile-web-app-title" content="Tone">
<title>Tone</title>
<script>
// Generate icon as canvas and inject as favicon + apple-touch-icon
(function() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');

  // Black background with rounded corners for apple icon
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, size, size);

  // Scale to draw the sound icon centered
  const scale = size / 60;
  ctx.save();
  ctx.scale(scale, scale);

  // Speaker body
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.beginPath();
  ctx.moveTo(10, 20); ctx.lineTo(10, 40); ctx.lineTo(22, 40);
  ctx.lineTo(38, 52); ctx.lineTo(38, 8); ctx.lineTo(22, 20);
  ctx.closePath();
  ctx.fill();

  // Sound wave 1
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(44, 20);
  ctx.quadraticCurveTo(52, 30, 44, 40);
  ctx.stroke();

  // Sound wave 2
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.beginPath();
  ctx.moveTo(48, 14);
  ctx.quadraticCurveTo(60, 30, 48, 46);
  ctx.stroke();

  ctx.restore();

  const dataUrl = c.toDataURL('image/png');

  // Favicon
  const link = document.createElement('link');
  link.rel = 'icon';
  link.type = 'image/png';
  link.href = dataUrl;
  document.head.appendChild(link);

  // Apple touch icon (180x180 with rounded corners baked in)
  const c2 = document.createElement('canvas');
  c2.width = c2.height = 180;
  const ctx2 = c2.getContext('2d');
  const r = 40;
  ctx2.beginPath();
  ctx2.moveTo(r, 0);
  ctx2.lineTo(180 - r, 0);
  ctx2.quadraticCurveTo(180, 0, 180, r);
  ctx2.lineTo(180, 180 - r);
  ctx2.quadraticCurveTo(180, 180, 180 - r, 180);
  ctx2.lineTo(r, 180);
  ctx2.quadraticCurveTo(0, 180, 0, 180 - r);
  ctx2.lineTo(0, r);
  ctx2.quadraticCurveTo(0, 0, r, 0);
  ctx2.closePath();
  ctx2.fillStyle = '#000000';
  ctx2.fill();
  ctx2.clip();
  ctx2.drawImage(c, 0, 0, 180, 180);

  const appleUrl = c2.toDataURL('image/png');
  const appleLink = document.createElement('link');
  appleLink.rel = 'apple-touch-icon';
  appleLink.href = appleUrl;
  document.head.appendChild(appleLink);
})();
</script>

:root {
  --bg: #050505;
  --white: #f5f2ec;
  --accent: #c8ff00;
  --accent-dim: #8aad00;
  --bar-track: #1a1a1a;
  --bar-fill: #c8ff00;
  --font-display: 'Unbounded', sans-serif;
  --font-mono: 'DM Mono', monospace;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--white);
  font-family: var(--font-display);
}

/* ── Shared screen base ────────────────────────────── */
.screen {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: env(safe-area-inset-top, 5vw) env(safe-area-inset-right, 5vw)
           env(safe-area-inset-bottom, 5vw) env(safe-area-inset-left, 5vw);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.screen.visible {
  opacity: 1;
  pointer-events: auto;
}

/* ── 1. SPLASH ─────────────────────────────────────── */
#splash {
  background: var(--bg);
}

.splash-inner {
  max-width: 900px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.5rem;
  padding: 5vw;
}

.concerto-label {
  font-family: var(--font-mono);
  font-size: clamp(10px, 1.2vw, 14px);
  font-weight: 300;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--accent);
  opacity: 0.7;
}

.concerto-title {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(52px, 11vw, 140px);
  letter-spacing: -0.04em;
  line-height: 0.9;
  color: var(--white);
  text-align: center;
  /* flash toggled via JS */
  transition: opacity 0.08s ease;
  user-select: none;
}

.concerto-title span {
  display: inline-block;
  position: relative;
}

/* Glitch underline */
.concerto-title span::after {
  content: '';
  display: block;
  height: 4px;
  width: 0%;
  background: var(--accent);
  margin-top: 0.15em;
  transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

#splash.visible .concerto-title span::after {
  width: 100%;
}

.splash-tagline {
  font-family: var(--font-mono);
  font-size: clamp(11px, 1.4vw, 16px);
  font-weight: 300;
  letter-spacing: 0.15em;
  color: rgba(245, 242, 236, 0.35);
  text-transform: uppercase;
}

/* decorative grid lines */
.splash-grid {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(200, 255, 0, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200, 255, 0, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

/* corner marks */
.corner {
  position: absolute;
  width: 28px;
  height: 28px;
  border-color: rgba(200, 255, 0, 0.4);
  border-style: solid;
}
.corner-tl { top: 24px; left: 24px; border-width: 2px 0 0 2px; }
.corner-tr { top: 24px; right: 24px; border-width: 2px 2px 0 0; }
.corner-bl { bottom: 24px; left: 24px; border-width: 0 0 2px 2px; }
.corner-br { bottom: 24px; right: 24px; border-width: 0 2px 2px 0; }

/* ── 2. BLACK ──────────────────────────────────────── */
#black {
  background: #000000;
}

/* ── 3. LOADING BAR ───────────────────────────────── */
#loading {
  background: var(--bg);
  gap: 1.5rem;
}

.loader-wrap {
  max-width: 560px;
  width: 90%;
  display: flex;
  flex-direction: column;
  gap: 1.2rem;
}

.loader-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.loader-label {
  font-family: var(--font-mono);
  font-size: clamp(9px, 1.1vw, 12px);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(245, 242, 236, 0.4);
}

.loader-pct {
  font-family: var(--font-mono);
  font-size: clamp(11px, 1.4vw, 16px);
  color: var(--accent);
  letter-spacing: 0.05em;
}

.loader-track {
  width: 100%;
  height: 3px;
  background: var(--bar-track);
  border-radius: 2px;
  overflow: hidden;
  position: relative;
}

.loader-fill {
  height: 100%;
  width: 0%;
  background: var(--bar-fill);
  border-radius: 2px;
  box-shadow: 0 0 12px rgba(200, 255, 0, 0.6);
  transition: width 0.08s linear;
}

/* shimmer on fill */
.loader-fill::after {
  content: '';
  position: absolute;
  right: 0;
  top: 0;
  width: 40px;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
  animation: shimmer 0.8s ease infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-40px); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateX(10px); opacity: 0; }
}

.loader-sub {
  font-family: var(--font-mono);
  font-size: clamp(9px, 1vw, 11px);
  color: rgba(245, 242, 236, 0.2);
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

/* ── Noise overlay ────────────────────────────────── */
.noise {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
  opacity: 0.035;
  mix-blend-mode: screen;
}

/* ── Scan line ─────────────────────────────────────── */
.scanline {
  position: fixed;
  top: -100%;
  left: 0;
  width: 100%;
  height: 2px;
  background: linear-gradient(transparent, rgba(200,255,0,0.06), transparent);
  pointer-events: none;
  z-index: 998;
  animation: scan 6s linear infinite;
}

@keyframes scan {
  0%   { top: -2px; }
  100% { top: 100%; }
}

/* ── Tablet media ─────────────────────────────────── */
@media (min-width: 600px) and (max-width: 1024px) {
  .concerto-title { font-size: clamp(72px, 14vw, 120px); }
  .corner { width: 36px; height: 36px; }
}

<body>

  <!-- Atmosphere -->

  <div class="noise"></div>
  <div class="scanline"></div>

  <!-- Screen 1: Splash -->

  <div class="screen" id="splash">
    <div class="splash-grid"></div>
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="splash-inner">
      <p class="concerto-label">◈ Live Performance System</p>
      <h1 class="concerto-title" id="concertoText"><span>Concerto</span></h1>
      <p class="splash-tagline">Initializing sequence&nbsp;·&nbsp;Stand by</p>
    </div>
  </div>

  <!-- Screen 2: Black -->

  <div class="screen" id="black"></div>

  <!-- Screen 3: Loading Bar -->

  <div class="screen" id="loading">
    <div class="loader-wrap">
      <div class="loader-header">
        <span class="loader-label">Loading assets</span>
        <span class="loader-pct" id="pctLabel">0%</span>
      </div>
      <div class="loader-track">
        <div class="loader-fill" id="loaderFill"></div>
      </div>
      <p class="loader-sub">Concerto&nbsp;·&nbsp;System boot</p>
    </div>
  </div>

  <script>
    /* ─── Utilities ─────────────────────────────────── */
    const rand  = (min, max) => Math.random() * (max - min) + min;
    const randInt = (min, max) => Math.floor(rand(min, max + 1));

    const splashEl  = document.getElementById('splash');
    const blackEl   = document.getElementById('black');
    const loadingEl = document.getElementById('loading');
    const titleEl   = document.getElementById('concertoText');
    const fillEl    = document.getElementById('loaderFill');
    const pctEl     = document.getElementById('pctLabel');

    const screens = [splashEl, blackEl, loadingEl];

    /* ─── Show / hide screens ───────────────────────── */
    function showOnly(el) {
      screens.forEach(s => s.classList.remove('visible'));
      el.classList.add('visible');
    }

    /* ─── Flash logic (splash) ──────────────────────── */
    let flashTimer = null;
    let flashOn    = true;

    function stopFlash() {
      clearTimeout(flashTimer);
      titleEl.style.opacity = '1';
    }

    function startFlash() {
      stopFlash();

      function toggle() {
        flashOn = !flashOn;
        titleEl.style.opacity = flashOn ? '1' : '0';
        const interval = rand(0, 10) * 1000;
        flashTimer = setTimeout(toggle, interval);
      }

      const firstDelay = rand(0, 10) * 1000;
      flashTimer = setTimeout(toggle, firstDelay);
    }

    /* ─── Loading bar logic ─────────────────────────── */
    let barInterval = null;
    let barPct      = 0;

    function stopBar() {
      clearInterval(barInterval);
      barPct = 0;
      fillEl.style.width = '0%';
      pctEl.textContent  = '0%';
    }

    function startBar() {
      stopBar();
      const duration = rand(1000, 2800);
      const tick     = 40; // ms per frame
      const steps    = duration / tick;
      const increment = 100 / steps;

      barInterval = setInterval(() => {
        barPct = Math.min(barPct + increment, 100);
        const display = Math.floor(barPct);
        fillEl.style.width  = barPct + '%';
        pctEl.textContent   = display + '%';

        if (barPct >= 100) {
          clearInterval(barInterval);
        }
      }, tick);
    }

    /* ─── Screen switcher ───────────────────────────── */
    const SCREEN_IDS = ['concerto_splash', 'black_screen', 'loading_bar'];

    function pickScreen() {
      const choice = SCREEN_IDS[randInt(0, 2)];
      const nextDelay = rand(0, 3) * 1000;

      // Teardown
      stopFlash();
      stopBar();

      if (choice === 'concerto_splash') {
        showOnly(splashEl);
        startFlash();
        setTimeout(pickScreen, nextDelay);

      } else if (choice === 'black_screen') {
        showOnly(blackEl);
        // Black screen always hides after exactly 0.5s
        setTimeout(() => {
          blackEl.classList.remove('visible');
          // After hiding, wait remaining time (if any) before next screen
          const remaining = Math.max(0, nextDelay - 500);
          setTimeout(pickScreen, remaining);
        }, 500);

      } else {
        // loading_bar
        showOnly(loadingEl);
        startBar();
        setTimeout(pickScreen, nextDelay);
      }
    }

    /* ─── Boot ──────────────────────────────────────── */
    pickScreen();
  </script>

</body>
